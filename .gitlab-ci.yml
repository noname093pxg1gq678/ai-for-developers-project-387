# Агент-контур self-hosted GitLab: перенос всех воркфлоу проекта из GitHub
# Actions (тикет #15 + доработки сессии переноса).
#
# ОРГАНИЗАЦИЯ ПАЙПЛАЙНОВ. workflow rules собирают пайплайн в четырёх случаях:
# 1. AGENT_EVENT задан - событие от вебхук-релея (gitlab/relay/): автотриаж issue,
#    команда в issue, авторевью MR (open/reopen/update), команда в MR.
# 2. push в main - CI-проверки слияния (эквивалент check.yml).
# 3. merge_request_event - CI-проверки на MR (эквивалент check.yml на PR).
# 4. schedule/web - плановый аудит приложения (эквивалент audit.yml) и ручной
#    запуск любого сценария без ожидания расписания.
#
# ВАЖНО: правила (rules) в GitLab вычисляются при СОЗДАНИИ пайплайна, до
# выполнения джоб - переменные из dotenv-артефактов предыдущих джоб в них
# недоступны. Поэтому доверенность и результат агентной работы проверяются
# ВНУТРИ скриптов джоб (guard-dotenv и agent.env), а rules используют только
# переменные, заданные релеем при запуске пайплайна.
#
# ТОКЕНЫ ПО ДЖОБАМ (в GitLab права определяются токеном, а не policy):
# - guard-dotenv: секретов нет. Чекаут использует CI_JOB_TOKEN, вбитый
#   раннером в remote: он read-only.
# - agent/review/audit: OPENCODE_API_KEY (masked + protected CI/CD-переменная,
#   инжектируется раннером автоматически) и AGENT_GITLAB_TOKEN (project access
#   token scope api, без write_repository - glab и curl публикуют комментарии
#   и ответы, но пушить им нельзя). CI_JOB_TOKEN чекаута удаляется ДО запуска
#   модели: иначе модель могла бы извлечь его из remote.
# - publish: PUSH_TOKEN (project access token, scope api + write_repository,
#   masked + protected). Модель его не видит: переменная живёт только в этой
#   джобе. Пуш и MR от имени владельца: MR от бота не запускает новые
#   пайплайны и требует ручного подтверждения.
#
# resource_group по issue/MR - аналог GitHub concurrency: прогоны одного
# тикета не пересекаются. Команда передаётся в dotenv base64: dotenv-артефакт
# GitLab не поддерживает многострочные значения, а тело комментария может
# содержать кавычки, кириллицу и переводы строк.

workflow:
  rules:
    - if: "$AGENT_EVENT"
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
    - if: "$CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - if: "$CI_PIPELINE_SOURCE == 'schedule'"
    - if: "$CI_PIPELINE_SOURCE == 'web'"

stages: [guard, agent, publish, check, review, audit]

# ---------------------------------------------------------------------------
# Агентный контур (события релея)
# ---------------------------------------------------------------------------

guard-dotenv:
  stage: guard
  image: bash:5
  rules:
    - if: "$AGENT_EVENT"
  timeout: 5m
  script:
    - bash gitlab/scripts/agent-guard.sh > guard.env
  artifacts:
    when: always
    reports:
      dotenv: guard.env

# Общий bootstrap модели (mise + opencode-ai) для agent/review/audit
.common-agent: &common-agent
  image: alpine:3.21
  variables:
    # glab и curl для меток и комментариев; токен с scope api, без write_repository
    GITLAB_TOKEN: $AGENT_GITLAB_TOKEN
    GITLAB_HOST: $CI_SERVER_HOST
  before_script:
    - apk add --no-cache bash ca-certificates curl git
    - git config user.name "$AGENT_USERNAME"
    - git config user.email "${AGENT_USERNAME}@users.noreply.gitlab"
    # MR-режим: чекаут head-ветки MR делается ДО удаления remote
    - |
      if [ -n "${MR_SOURCE_BRANCH:-}" ]; then
        git fetch origin "$MR_SOURCE_BRANCH"
        git checkout "$MR_SOURCE_BRANCH"
      fi
    # Модель не должна видеть токен чекаута: удаляем remote до её запуска
    - git remote remove origin || true
    - export MISE_TRUSTED_CONFIG_PATHS="$CI_PROJECT_DIR"
    - curl -fsSL https://mise.run | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - mise install
    # opencode-ai ставится mise без postinstall, а тот скачивает бинарник платформы
    - root="$(mise where npm:opencode-ai)"
    - postinstall="$(find "$root" -name postinstall.mjs -path '*opencode-ai*' | head -n 1)"
    - cd "$(dirname "$postinstall")" && node postinstall.mjs && cd "$CI_PROJECT_DIR"

agent:
  <<: *common-agent
  stage: agent
  needs: [guard-dotenv]
  rules:
    - if: "$AGENT_EVENT"
  timeout: 20m
  resource_group: "issue-$ISSUE_IID"
  script:
    # Guard вычислен ДО модели: недоверенное событие завершает джобу без
    # запуска модели (defense in depth поверх фильтров релея)
    - bash gitlab/scripts/agent-guard.sh > guard2.env
    - source guard2.env
    - '[ "$TRUSTED" = "true" ] || { echo "событие недоверенное - агент не запускается"; exit 0; }'
    # Текст команды через файл: тело комментария может содержать кавычки и кириллицу
    - |
      if [ -n "$AGENT_COMMAND_B64" ]; then
        printf '%s\n' "$(printf '%s' "$AGENT_COMMAND_B64" | base64 -d)" > agent-command.txt
        if [ -n "${MR_IID:-}" ]; then
          { cat agent-command.txt; printf '\n\n'; cat gitlab/agent-mr-rules-glab.txt; } > agent-prompt.txt
        else
          { cat agent-command.txt; printf '\n\n'; cat gitlab/agent-rules-glab.txt; } > agent-prompt.txt
        fi
      else
        printf '%s\n' "Выполни triage issue #${ISSUE_IID} (автор @${ISSUE_AUTHOR}) по скиллу triage из docs/agents: прочитай обращение через glab issue view ${ISSUE_IID}, проставь метки через glab issue update ${ISSUE_IID} --label (needs-triage и категорию: enhancement, bug или question), опубликуй triage-заметку комментарием glab issue note ${ISSUE_IID} с дисклеймером *(generated by AI)* и вопросами к репортёру, если они нужны. Код не меняй, ветки не создавай. Работа ведётся в GitLab: используй glab (GITLAB_TOKEN и GITLAB_HOST уже заданы), не gh." > agent-prompt.txt
      fi
    - opencode run -m opencode-go/glm-5.3-flash "$(cat agent-prompt.txt)" > agent-answer.md
    # Доставка работы: модель коммитит в ветку и пишет её имя в agent-branch.txt,
    # пуш и MR делает publish-джоба отдельным токеном. Коммиты упаковываются в
    # bundle-артефакт: модель не может запушить, у неё нет токена и remote.
    - |
      if [ -f agent-branch.txt ]; then
        git bundle create agent-work.bundle --all
        {
          echo "WORK_PUBLISHED=true"
          echo "AGENT_BRANCH=$(tr -d '[:space:]' < agent-branch.txt)"
        } > agent.env
      else
        echo "WORK_PUBLISHED=false" > agent.env
      fi
    # Ответ агента - комментарий в issue или MR; без ответа - fallback.
    # Публикация выполняется всегда, даже при пустом ответе или падении
    # предыдущих шагов: срыв доставки не оставляет работу невидимой.
    - |
      if [ -s agent-answer.md ]; then
        curl -sf --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --data-urlencode "body@agent-answer.md" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues/$ISSUE_IID/notes" > /dev/null
      else
        curl -sf --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --data-urlencode "body=Агент завершил работу без текстового ответа." "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues/$ISSUE_IID/notes" > /dev/null
      fi
  artifacts:
    when: always
    paths:
      - agent-answer.md
      - agent-work.bundle
    reports:
      dotenv: agent.env

publish:
  stage: publish
  image: alpine:3.21
  needs: [agent]
  rules:
    - if: "$AGENT_EVENT"
  timeout: 5m
  resource_group: "issue-$ISSUE_IID"
  script:
    - apk add --no-cache git curl
    - '[ "$WORK_PUBLISHED" = "true" ] || { echo "агент не сдал ветку - публиковать нечего"; exit 0; }'
    # Явный remote от токена доставки: модель его не видит (джоба после agent)
    - git clone "$CI_SERVER_URL/$CI_PROJECT_PATH.git" repo
    - cd repo
    - git fetch "../agent-work.bundle" "refs/heads/${AGENT_BRANCH}:refs/heads/${AGENT_BRANCH}"
    - git push "https://oauth2:${PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$AGENT_BRANCH"
    # MR-режим (команда пришла из MR): ветка уже существует, пуш обновляет MR.
    # Issue-режим: создаётся новый MR.
    - |
      if [ -n "${MR_IID:-}" ]; then
        curl -sf --header "PRIVATE-TOKEN: $PUSH_TOKEN" --data-urlencode "body=Агент запушил изменения в head-ветку MR: ${AGENT_BRANCH}. Повторное ревью запустится с новым push." "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/${MR_IID}/notes" > /dev/null
      else
        curl -sf --header "PRIVATE-TOKEN: $PUSH_TOKEN" --form "source_branch=${AGENT_BRANCH}" --form "target_branch=main" --form "title=Агент: работа по issue #${ISSUE_IID}" --form "description=Автоматическая работа агента по issue #${ISSUE_IID}; ответ агента - в issue." --form "remove_source_branch=true" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests" > /dev/null
      fi

# ---------------------------------------------------------------------------
# CI-проверки (эквивалент .github/workflows/check.yml): push в main и MR
# ---------------------------------------------------------------------------

check:
  stage: check
  image: node:24
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
    - if: "$CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
  timeout: 45m
  variables:
    MISE_TRUSTED_CONFIG_PATHS: $CI_PROJECT_DIR
  script:
    - curl -fsSL https://mise.run | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - mise install
    # mise-хук postinstall запускает npm install после установки; повторно - ci
    - npm ci --ignore-scripts
    # Полный чек: линт (oxlint, oxfmt, jactionlint), типы, сборка, юнит- и e2e-тесты
    - mise run check
    # Свежесть генератов контракта и тесты GitLab-контура
    - npm run contract:check
    - mise run test:relay
    - mise run test:guard
    - bash .github/scripts/agent-guard.test.sh

# ---------------------------------------------------------------------------
# Авторевью MR и runtime-check (эквивалент pr-review.yml; события релея)
# ---------------------------------------------------------------------------

review:
  <<: *common-agent
  stage: review
  needs: [guard-dotenv]
  rules:
    # Авторевью запускается на события MR (open/reopen/update) от релея
    - if: '$AGENT_EVENT == "merge_request"'
  timeout: 15m
  resource_group: "issue-$ISSUE_IID"
  script:
    - bash gitlab/scripts/agent-guard.sh > guard2.env
    - source guard2.env
    - '[ "$TRUSTED" = "true" ] || { echo "событие недоверенное - ревью не запускается"; exit 0; }'
    # Контекст ревью: тело MR, diff и статусы пайплайна через glab/API
    - |
      {
        printf '%s\n' "Проведи авторевью MR !${MR_IID} «${MR_TITLE}» (ветки ${MR_SOURCE_BRANCH} -> ${MR_TARGET_BRANCH})."
        printf '%s\n' "Читай REVIEW.md (критерии ревью календаря), описание MR (glab mr view ${MR_IID}), diff (glab mr diff ${MR_IID}) и статусы пайплайнов MR (glab ci list --merge-request ${MR_IID} или API)."
        printf '%s\n' "Замечания - только по критериям REVIEW.md; каждое содержит файл, строку, условия ошибки и последствие. Форматирование кода не ревьюится (это линтер). Если подтверждённых дефектов нет - прямо об этом сообщи, не выдумывай замечания."
        printf '%s\n' "Публикуй ревью комментарием MR: glab mr note ${MR_IID} --message \"...\" с дисклеймером *(generated by AI)* в конце."
        printf '%s\n' "Код не меняй, ветки не создавай. Работа ведётся в GitLab: используй glab (GITLAB_TOKEN и GITLAB_HOST уже заданы), не gh."
      } > review-prompt.txt
    - opencode run -m opencode-go/glm-5.3-flash "$(cat review-prompt.txt)" > review-answer.md
    # Ревью код не меняет: публикация из артефакта, модель-фри, даже при пустом ответе
    - |
      if [ -s review-answer.md ]; then
        curl -sf --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --data-urlencode "body@review-answer.md" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/${MR_IID}/notes" > /dev/null
      else
        curl -sf --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --data-urlencode "body=Авторевью завершилось без текстового вывода; лог - в джобе review этого пайплайна." "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/${MR_IID}/notes" > /dev/null
      fi

runtime-check:
  stage: review
  image: node:24
  needs: [guard-dotenv]
  rules:
    # Проверка приложения в рантайме на head-коммите MR: без модели, артефакт
    # со скриншотами e2e и SHA доказывает, на каком коммите прогонялся e2e
    - if: '$AGENT_EVENT == "merge_request"'
  timeout: 20m
  variables:
    MISE_TRUSTED_CONFIG_PATHS: $CI_PROJECT_DIR
  script:
    # SHA head-коммита фиксируется до сборки: артефакт доказывает свежесть
    - git rev-parse HEAD | tee head-sha.txt
    - curl -fsSL https://mise.run | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - mise install
    - npm ci --ignore-scripts
    - npm run build --workspaces
    - mise run e2e
  artifacts:
    when: always
    paths:
      - head-sha.txt
      - e2e-artifacts/
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Плановый аудит приложения (эквивалент audit.yml): schedule и web
# ---------------------------------------------------------------------------

audit:
  <<: *common-agent
  stage: audit
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  timeout: 25m
  variables:
    GITLAB_TOKEN: $AGENT_GITLAB_TOKEN
    GITLAB_HOST: $CI_SERVER_HOST
    # Адрес публикуемого приложения; переопределяется CI/CD-переменной
    AUDIT_URL: https://call-booking-387-production.up.railway.app
    # Трекинг-issue аудита, куда публикуются итоги прогонов
    AUDIT_TRACKING_ISSUE: ""
    # Учебный режим для ручных запусков: явно обозначенная учебная находка
    TRAINING_FINDING: "false"
  script:
    - apk add --no-cache chromium nodejs npm
    # SHA-фиксация отчёта: Chromium из пакетов дистрибутива
    - export CHROME_PATH=/usr/bin/chromium-browser
    # Недоступность приложения - не пустой прогон, а данные об отсутствии:
    # агент размечает это отдельно (это не подтверждает исправление дефекта).
    # Поэтому падение Lighthouse не роняет джобу.
    - |
      if npx --yes lighthouse@12 "$AUDIT_URL" \
        --quiet --chrome-flags="--headless --no-sandbox" \
        --output=json --output-path=audit-report.json \
        --only-categories=performance,accessibility,best-practices,seo; then
        echo "Отчёт собран"
      else
        echo "Отчёт не собран - приложение недоступно или Lighthouse упал"
      fi
    # Учебная находка передаётся промптом, реальный разбор - из артефакта сборки
    - |
      {
        cat gitlab/audit-prompt-glab.txt
        printf '\n\nАдрес приложения: %s. Трекинг-issue аудита: %s. Учебный режим: %s.\n' \
          "$AUDIT_URL" "${AUDIT_TRACKING_ISSUE:-не задан}" "$TRAINING_FINDING"
      } > audit-prompt.txt
    - opencode run -m opencode-go/glm-5.3-flash "$(cat audit-prompt.txt)" > audit-answer.md
    # Итог прогона - комментарий в трекинг-issue; находки - отдельные issues.
    # Без трекинг-issue итог публикуется в переменную джобы (лог) - владелец
    # задаёт AUDIT_TRACKING_ISSUE после создания issue аудита.
    - |
      if [ -s audit-answer.md ] && [ -n "${AUDIT_TRACKING_ISSUE:-}" ]; then
        curl -sf --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --data-urlencode "body@audit-answer.md" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues/${AUDIT_TRACKING_ISSUE}/notes" > /dev/null
      fi
  artifacts:
    when: always
    paths:
      - audit-report.json
      - audit-answer.md
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Релизы (эквивалент release-please.yml): ручной запуск из main
# ---------------------------------------------------------------------------

release-please:
  stage: audit
  image: node:24
  rules:
    # Ручной запуск: Run pipeline из main с RELEASE=true
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE == "true"'
  timeout: 10m
  variables:
    RELEASE_TOKEN: ""
  script:
    # release-please поддерживает GitLab; токен - project access token с
    # write_repository. Флаги для self-hosted-инстанса сверить при подключении
    # (host передаётся через repo-url; для не-gitlab.com хостов проверяется
    # версия release-please с поддержкой GitLab).
    - |
      npx --yes release-please release-pr \
        --repo-url="$CI_SERVER_URL/$CI_PROJECT_PATH" \
        --token="$RELEASE_TOKEN" \
        --config=release-please-config.json \
        --manifest=.release-please-manifest.json
