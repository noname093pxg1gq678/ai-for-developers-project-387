# Агент-контур self-hosted GitLab: перенос .github/workflows/agent.yml и triage.yml
# (тикет #15). GitHub этот файл игнорирует, GitLab активирует при переносе проекта.
#
# ТРИГГЕР: пайплайн запускает вебхук-релей (gitlab/relay/) только для доверенных
# событий - issue (новый тикет, автотриаж) и note (команда @agent / /oc / /opencode
# в комментарии). Боты, участники без роли Developer+ и issues с метками
# отфильтрованы релеем ещё до пайплайна; guard-dotenv перепроверяет формат команды
# и ботов и сводит переменные в dotenv-артефакт.
#
# ТОКЕНЫ ПО ДЖОБАМ (в GitLab права определяются токеном, а не policy):
# - guard-dotenv: секретов нет, только переменные пайплайна. Чекаут использует
#   CI_JOB_TOKEN, вбитый раннером в remote: он read-only, скрипт с git не работает.
# - agent: OPENCODE_API_KEY (ключ модели, masked + protected CI/CD-переменная,
#   инжектируется раннером автоматически) и AGENT_GITLAB_TOKEN
#   (project access token scope api, без write_repository - glab и curl проставляют
#   метки, публикуют комментарии и ответ агента, но пушить им нельзя). CI_JOB_TOKEN
#   чекаута удаляется ДО запуска модели: иначе модель могла бы извлечь его из remote.
# - publish: PUSH_TOKEN (project access token, scope api + write_repository,
#   masked + protected). Модель его не видит: переменная живёт только в этой джобе.
#
# resource_group по issue - аналог GitHub concurrency: прогоны одного тикета не
# пересекаются. Команда передаётся в dotenv base64: dotenv-артефакт GitLab не
# поддерживает многострочные значения, а тело комментария может содержать
# кавычки, кириллицу и переводы строк.

workflow:
  rules:
    # Пайплайн собирается только по событию от релея (AGENT_EVENT задан);
    # обычные push-пайплайны не запускаются
    - if: "$AGENT_EVENT"

stages: [guard, agent, publish]

guard-dotenv:
  stage: guard
  image: bash:5
  timeout: 5m
  script:
    - bash gitlab/scripts/agent-guard.sh > guard.env
  artifacts:
    when: always
    reports:
      dotenv: guard.env

agent:
  stage: agent
  image: alpine:3.21
  needs: [guard-dotenv]
  rules:
    - if: '$TRUSTED == "true"'
  timeout: 20m
  resource_group: "issue-$ISSUE_IID"
  variables:
    # glab и curl для меток и комментариев; токен с scope api, без write_repository
    GITLAB_TOKEN: $AGENT_GITLAB_TOKEN
    GITLAB_HOST: $CI_SERVER_HOST
  before_script:
    - apk add --no-cache bash ca-certificates curl git
    - git config user.name "$AGENT_USERNAME"
    - git config user.email "${AGENT_USERNAME}@users.noreply.gitlab"
    # Модель не должна видеть токен чекаута: удалём remote до её запуска
    - git remote remove origin || true
  script:
    # mise ставит инструменты из mise.toml (node, opencode-ai, glab)
    - export MISE_TRUSTED_CONFIG_PATHS="$CI_PROJECT_DIR"
    - curl -fsSL https://mise.run | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - mise install
    # opencode-ai ставится mise без postinstall, а тот скачивает бинарник платформы
    - root="$(mise where npm:opencode-ai)"
    - postinstall="$(find "$root" -name postinstall.mjs -path '*opencode-ai*' | head -n 1)"
    - cd "$(dirname "$postinstall")" && node postinstall.mjs && cd "$CI_PROJECT_DIR"
    # Текст команды через файл: тело комментария может содержать кавычки и кириллицу
    - |
      if [ -n "$AGENT_COMMAND_B64" ]; then
        printf '%s\n' "$(printf '%s' "$AGENT_COMMAND_B64" | base64 -d)" > agent-command.txt
        { cat agent-command.txt; printf '\n\n'; cat gitlab/agent-rules-glab.txt; } > agent-prompt.txt
      else
        printf '%s\n' "Выполни triage issue #${ISSUE_IID} (автор @${ISSUE_AUTHOR}) по скиллу triage из docs/agents: прочитай обращение через glab issue view ${ISSUE_IID}, проставь метки через glab issue update ${ISSUE_IID} --label (needs-triage и категорию: enhancement, bug или question), опубликуй triage-заметку комментарием glab issue note ${ISSUE_IID} с дисклеймером *(generated by AI)* и вопросами к репортёру, если они нужны. Код не меняй, ветки не создавай. Работа ведётся в GitLab: используй glab (GITLAB_TOKEN и GITLAB_HOST уже заданы), не gh." > agent-prompt.txt
      fi
    - opencode run -m opencode-go/glm-5.3-flash "$(cat agent-prompt.txt)" > agent-answer.md
    # Доставка работы: модель коммитит в ветку и пишет её имя в agent-branch.txt,
    # пуш и MR делает publish-джоба отдельным токеном. Коммиты упаковываются в
    # bundle-артефакт: модель не может запушить, у неё нет токена и remote.
    - |
      if [ -f agent-branch.txt ]; then
        git bundle create agent-work.bundle --all
        {
          echo "WORK_PUBLISHED=true"
          echo "AGENT_BRANCH=$(tr -d '[:space:]' < agent-branch.txt)"
        } > agent.env
      else
        echo "WORK_PUBLISHED=false" > agent.env
      fi
    # Ответ агента - комментарий в issue; без текстового ответа - fallback
    - |
      if [ -s agent-answer.md ]; then
        curl -sf --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --data-urlencode "body@agent-answer.md" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues/$ISSUE_IID/notes" > /dev/null
      else
        curl -sf --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --data-urlencode "body=Агент завершил работу без текстового ответа." "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues/$ISSUE_IID/notes" > /dev/null
      fi
  artifacts:
    when: always
    paths:
      - agent-answer.md
      - agent-work.bundle
    reports:
      dotenv: agent.env

publish:
  stage: publish
  image: alpine:3.21
  needs: [agent]
  rules:
    # Публикация только если агент сдал ветку (agent.env от agent-джобы)
    - if: '$WORK_PUBLISHED == "true"'
  timeout: 5m
  resource_group: "issue-$ISSUE_IID"
  script:
    - apk add --no-cache git curl
    # Явный remote от токена доставки: модель его не видит (джоба после agent)
    - git clone "$CI_SERVER_URL/$CI_PROJECT_PATH.git" repo
    - cd repo
    - git fetch "../agent-work.bundle" "refs/heads/${AGENT_BRANCH}:refs/heads/${AGENT_BRANCH}"
    - git push "https://oauth2:${PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$AGENT_BRANCH"
    - |
      curl -sf --header "PRIVATE-TOKEN: $PUSH_TOKEN" --form "source_branch=${AGENT_BRANCH}" --form "target_branch=main" --form "title=Агент: работа по issue #${ISSUE_IID}" --form "description=Автоматическая работа агента по issue #${ISSUE_IID}; ответ агента - в issue." --form "remove_source_branch=true" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests" > /dev/null
