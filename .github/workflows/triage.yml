name: triage

# Автотриаж новых обращений: issue_comment-агент управляет существующими
# тикетами по командам, этот воркфлоу разбирает только что созданные issues.

on:
  issues:
    types:
      - opened

permissions: {}

concurrency:
  group: triage-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
    outputs:
      needs_triage: ${{ steps.guard.outputs.needs_triage }}
    steps:
      - name: Check triage filters
        id: guard
        env:
          # Ботов не триажим: служебные issues платформы размечены заранее
          AUTHOR_TYPE: ${{ github.event.issue.user.type }}
          # Размеченные issues пропускаются: у готовых тикетов стоит
          # ready-for-agent, у разобранных - triage-метки; автотриаж
          # трогает только обращения без единой метки
          LABELS_JSON: ${{ toJSON(github.event.issue.labels) }}
        run: |
          if [ "$AUTHOR_TYPE" = "Bot" ]; then
            echo "needs_triage=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          label_count="$(echo "$LABELS_JSON" | jq 'length')"
          if [ "$label_count" -gt 0 ]; then
            echo "needs_triage=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "needs_triage=true" >> "$GITHUB_OUTPUT"

  triage:
    needs: guard
    if: needs.guard.outputs.needs_triage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - run: mise run setup

      # mise ставит npm-пакет opencode-ai без postinstall, а тот скачивает
      # бинарник платформы - запускаем вручную (см. agent.yml)
      - name: Finalize opencode install
        run: |
          root="$(mise where npm:opencode-ai)"
          postinstall="$(find "$root" -name postinstall.mjs -path '*opencode-ai*' | head -n 1)"
          cd "$(dirname "$postinstall")"
          node postinstall.mjs

      - name: Run triage agent
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Токен джобы с issues: write - агент проставляет метки и публикует
          # заметку. Пуш-прав у агента нет: код не меняется
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s\n' "Выполни triage issue #${ISSUE_NUMBER} «${ISSUE_TITLE}» по скиллу triage: проанализируй обращение, проставь метки через gh issue edit (needs-triage и категорию: enhancement, bug или question), опубликуй triage-заметку комментарием с дисклеймером *(generated by AI)* и вопросами к репортёру, если они нужны. Код не меняй, ветки не создавай." > triage-prompt.txt
          opencode run -m opencode-go/glm-5.3-flash "$(cat triage-prompt.txt)" > triage-answer.md
